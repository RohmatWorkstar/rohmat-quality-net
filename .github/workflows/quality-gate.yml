name: Quality Gate & Automated Net

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, edited ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Definition of Ready (DoR) Workflow Gate
  # Enforces that every pull request includes its required inputs before build.
  # ────────────────────────────────────────────────────────────────────────────
  dor-gate:
    name: "Gate: Definition of Ready (DoR)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Definition of Ready Inputs
        run: node scripts/verify-dor.js

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Frontend Test & Build Net (web/)
  # ────────────────────────────────────────────────────────────────────────────
  test-web:
    name: "Web: Unit & Contract Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Frontend Tests (Vitest)
        run: npm test -- --run

      - name: Verify TypeScript & Build
        run: npm run build

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: Backend API Test Net (api/)
  # ────────────────────────────────────────────────────────────────────────────
  test-api:
    name: "API: RSpec & Contract Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rakamin_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.2
          bundler-cache: true
          working-directory: api

      - name: Install PostgreSQL Client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Setup Database
        env:
          RAILS_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_USERNAME: postgres
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: rakamin_test
          PGHOST: 127.0.0.1
          PGPORT: 5433
          PGUSER: postgres
          PGPASSWORD: password
          PGDATABASE: rakamin_test
          SECRET_KEY_BASE: test_secret_key_base_for_ci_pipeline_only_32bytes_min
        run: |
          set +e
          echo "### DB Setup Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          echo "--- Testing TCP connection ---" >> $GITHUB_STEP_SUMMARY
          nc -zv 127.0.0.1 5433 2>&1 >> $GITHUB_STEP_SUMMARY
          echo "--- Creating schema and organizations table ---" >> $GITHUB_STEP_SUMMARY
          PGPASSWORD=password psql -h 127.0.0.1 -p 5433 -U postgres -d rakamin_test -c "CREATE SCHEMA IF NOT EXISTS ai_interview;" 2>&1 >> $GITHUB_STEP_SUMMARY
          PGPASSWORD=password psql -h 127.0.0.1 -p 5433 -U postgres -d rakamin_test -c "CREATE TABLE IF NOT EXISTS public.organizations (id BIGSERIAL PRIMARY KEY, name VARCHAR(255) NOT NULL, scheme VARCHAR(255) NOT NULL, identifier VARCHAR(255) NOT NULL, host VARCHAR(255) NOT NULL, alias_hosts VARCHAR[] NOT NULL DEFAULT '{}', config JSONB NOT NULL DEFAULT '{}', created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(), updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW());" 2>&1 >> $GITHUB_STEP_SUMMARY
          echo "--- Running rails db:migrate ---" >> $GITHUB_STEP_SUMMARY
          bundle exec rails db:migrate --trace 2>&1 >> $GITHUB_STEP_SUMMARY
          MIGRATE_EXIT=$?
          if [ $MIGRATE_EXIT -ne 0 ]; then
            echo "--- Migrate exited with $MIGRATE_EXIT, attempting schema:load ---" >> $GITHUB_STEP_SUMMARY
            bundle exec rails db:schema:load --trace 2>&1 >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          set -e

      - name: Run RSpec Tests
        env:
          RAILS_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_USERNAME: postgres
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: rakamin_test
          PGHOST: 127.0.0.1
          PGPORT: 5433
          PGUSER: postgres
          PGPASSWORD: password
          PGDATABASE: rakamin_test
          REDIS_URL: redis://127.0.0.1:6379/1
          SECRET_KEY_BASE: test_secret_key_base_for_ci_pipeline_only_32bytes_min
        run: bundle exec rspec --format documentation 2>&1 | tee -a $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────────────────────
  # Job 4: Gate Aggregator & Verdict
  # Surfaces a single unambiguous status for non-engineers.
  # ────────────────────────────────────────────────────────────────────────────
  gate-verdict:
    name: "Gate Summary & Release Readiness"
    needs: [dor-gate, test-web, test-api]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate Overall Gate Status
        run: |
          DOR_STATUS="${{ needs.dor-gate.result }}"
          WEB_STATUS="${{ needs.test-web.result }}"
          API_STATUS="${{ needs.test-api.result }}"

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            DOR_STATUS="success"
          fi

          echo "===================================================="
          echo "           QUALITY GATE EXECUTION SUMMARY           "
          echo "===================================================="
          echo "  - Definition of Ready (DoR): $DOR_STATUS"
          echo "  - Web Net (Tests & Build):   $WEB_STATUS"
          echo "  - API Net (RSpec & DB):       $API_STATUS"
          echo "===================================================="

          if [ "$DOR_STATUS" = "success" ] && [ "$WEB_STATUS" = "success" ] && [ "$API_STATUS" = "success" ]; then
            echo ""
            echo " [VERDICT] QUALITY GATE: PASSED"
            echo " This change satisfies all DoR inputs and DoD validation criteria."
            echo " Status: RELEASABLE"
            exit 0
          else
            echo ""
            echo " [VERDICT] QUALITY GATE: BLOCKED"
            echo " One or more quality gates failed. Review errors above."
            echo " Status: BLOCKED"
            exit 1
          fi
